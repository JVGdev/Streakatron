# Dev: `docker compose up -d --wait db` (or `pnpm db:up`), then `pnpm dev`.
# Daily use over Tailscale: `docker compose up -d --build`, then `tailscale serve --bg 3001`.

services:
  db:
    image: postgres:17
    container_name: streaktron-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: streaktron
      POSTGRES_PASSWORD: streaktron
      POSTGRES_DB: streaktron
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streaktron -d streaktron']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    container_name: streaktron-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://streaktron:streaktron@db:5432/streaktron
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3001}
      DATA_DIR: /app/data
    ports:
      # Loopback only: `tailscale serve` proxies the tailnet to it.
      - '127.0.0.1:${APP_PORT:-3001}:3001'
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
